name: Test & Email Report

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # 每天早上8点运行一次测试
    - cron: '0 8 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Run tests with Allure report
      run: |
        pytest \
          --headed=false \
          --slowmo=0 \
          --alluredir=report \
          -v \
          --ignore=venv \
          --tb=short
      continue-on-error: true

    - name: Generate Allure HTML report
      if: always()
      run: |
        allure generate report -o allure-report --clean
      continue-on-error: true

    - name: Archive Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ matrix.python-version }}
        path: allure-report/
        retention-days: 15

    - name: Archive raw report data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raw-report-data-${{ matrix.python-version }}
        path: report/
        retention-days: 15

    - name: Generate test summary
      if: always()
      id: test-summary
      run: |
        echo "test_status=$([ -d report ] && ls report/*.json 2>/dev/null | wc -l | xargs test 0 -ne && echo 'COMPLETED' || echo 'FAILED')" >> $GITHUB_OUTPUT
        echo "test_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        echo "python_version=${{ matrix.python-version }}" >> $GITHUB_OUTPUT

    outputs:
      test_status: ${{ steps.test-summary.outputs.test_status }}
      test_time: ${{ steps.test-summary.outputs.test_time }}
      python_version: ${{ steps.test-summary.outputs.python_version }}

  send-email:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Allure report
      uses: actions/download-artifact@v4
      with:
        name: allure-report-${{ needs.test.outputs.python_version }}
        path: allure-report
      continue-on-error: true

    - name: Download raw report data
      uses: actions/download-artifact@v4
      with:
        name: raw-report-data-${{ needs.test.outputs.python_version }}
        path: raw-report
      continue-on-error: true

    - name: Generate email body
      id: email-body
      env:
        BRANCH: ${{ github.ref_name }}
        COMMIT_HASH: ${{ github.sha }}
        COMMIT_AUTHOR: ${{ github.actor }}
        COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual trigger' }}
        TEST_STATUS: ${{ needs.test.outputs.test_status }}
        TEST_TIME: ${{ needs.test.outputs.test_time }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        # 使用 Python 脚本生成邮件 HTML 内容
        python scripts/generate_email.py

    - name: Send email notification via QQ SMTP
      uses: dawidd6/action-send-mail@v3
      with:
        # QQ 邮箱 SMTP 配置（从 GitHub Secrets 读取）
        server_address: ${{ secrets.HOST_QQ }}
        server_port: ${{ secrets.PORT_QQ }}
        username: ${{ secrets.USERNAME_QQ }}
        password: ${{ secrets.PASSWORD_QQ }}

        # 邮件主题：包含测试状态和分支信息
        subject: |
          [CRMEB 测试报告] ${{ github.repository }} - ${{ github.ref_name }} - ${{ needs.test.outputs.test_status }}

        # 收件人（使用 QQ 邮箱变量）
        to: ${{ secrets.USERNAME_QQ }}

        # 发件人显示名称
        from: CRMEB 自动化测试

        # 使用 HTML 格式的邮件正文
        html_body: file://email_body.html

        # 可选的邮件回复地址
        reply_to: ${{ secrets.USERNAME_QQ }}

        # 忽略证书验证（适用于国内 QQ 邮箱网络环境）
        ignore_cert: true
      continue-on-error: true

    - name: Log email status
      if: always()
      run: |
        echo "=========================================="
        echo "  Email Notification Status"
        echo "=========================================="
        echo "  Status: ${{ job.status }}"
        echo "  To: ${{ secrets.USERNAME_QQ }}"
        echo "  Server: ${{ secrets.HOST_QQ }}"
        echo "  Port: ${{ secrets.PORT_QQ }}"
        echo "=========================================="
